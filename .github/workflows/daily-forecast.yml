name: Daily forecast

# Fetch the latest data, forecast tomorrow for both zones, refresh the site, commit.
# The job holds no GPU and trains nothing — it only runs the models' predict paths on CPU.
on:
  schedule:
    # GitHub cron is UTC-only — there is no TZ knob — so 8am Eastern has to be written as the
    # UTC hour. 12:00 UTC == 08:00 EDT. Under EST (Nov-Mar) the same line fires at 07:00 local;
    # both are well after PJM posts the day's load, so the hour drifts but nothing breaks.
    - cron: '0 12 * * *'
  workflow_dispatch: {}       # allow a manual run from the Actions tab.

# The job commits web/ + docs/ back to the branch.
permissions:
  contents: write

concurrency:                  # never let two daily runs overlap on the same store.
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirement.txt   # this repo's file is singular, not requirements.txt

      - name: Install deps (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Download serving artifacts (weights + scalers + thermal refs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download serving-latest --pattern serving_bundle.tar.gz --clobber
          tar -xzf serving_bundle.tar.gz
          rm serving_bundle.tar.gz

      - name: Forecast + refresh site
        run: |
          # Once per zone. The congestion A/B used to run two arms per zone; it is settled
          # (_cong wins on every model) so the daily job runs that arm only, and src.serving.run
          # refuses to start if MATRIX_TAG and SERVING_ARM disagree. Each process serves the
          # twelve models in src.config.SERVING_MODELS -- six architectures, direct and residual
          # -- and writes only its own columns. CPU-only inference throughout.
          for zone in dom bge; do
            PJM_DATASET=$zone PJM_CONGESTION=1 PJM_LMP=0 python -m src.serving.run
          done
          python generate_web.py

      - name: Commit the updated store + site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/ docs/
          # Only commit if something actually changed (a stalled data source shouldn't churn).
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily forecast: $(date -u +%Y-%m-%d)"
            git push
          fi
