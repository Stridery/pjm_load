name: Daily forecast

# Fetch the latest data, forecast tomorrow for both zones, refresh the site, commit.
# The job holds no GPU and trains nothing — it only runs the models' predict paths on CPU.
on:
  schedule:
    - cron: '0 9 * * *'      # 09:00 UTC daily (~4-5am US Eastern), after PJM posts the day's load.
  workflow_dispatch: {}       # allow a manual run from the Actions tab.

# The job commits web/ + docs/ back to the branch.
permissions:
  contents: write

concurrency:                  # never let two daily runs overlap on the same store.
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirement.txt   # this repo's file is singular, not requirements.txt

      - name: Install deps (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Download serving artifacts (weights + scalers + thermal refs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download serving-latest --pattern serving_bundle.tar.gz
          tar -xzf serving_bundle.tar.gz
          rm serving_bundle.tar.gz

      - name: Forecast + refresh site
        run: |
          PJM_DATASET=dom python -m src.serving.run
          PJM_DATASET=bge python -m src.serving.run
          python generate_web.py

      - name: Commit the updated store + site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/ docs/
          # Only commit if something actually changed (a stalled data source shouldn't churn).
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily forecast: $(date -u +%Y-%m-%d)"
            git push
          fi
